version: '3.8'

services:
  # PHP + Apache Web Server (Backend API & Admin Panel)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lane3_backend
    restart: always
    ports:
      - 8080:80
    environment:
      - DB_HOST=db
      - DB_NAME=lane3
      - DB_USER=lane3_user
      - DB_PASS=lane3_password
      - JWT_SECRET=lane3-super-secret-jwt-key
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # MariaDB / MySQL Database
  db:
    image: mariadb:10.11
    container_name: lane3_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lane3
      MYSQL_USER: lane3_user
      MYSQL_PASSWORD: lane3_password
    ports:
      - 3307:3306
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: [CMD, mariadb-admin, ping, -h, localhost, -u, root, -proot_password]
      interval: 5s
      timeout: 5s
      retries: 5

  # phpMyAdmin (Web UI for database inspection & management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: lane3_phpmyadmin
    restart: always
    ports:
      - 8081:80
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
    depends_on:
      - db

volumes:
  db_data:
